# Pi-Squirrel configuration
# Sourced by every script in this repo. Edit values here instead of editing
# the scripts directly.

# --- Capture settings ---------------------------------------------------
# Local capture directory (always written to first, regardless of USB state)
LOOT_DIR="${HOME}/loot"

# Capture file rotation size, in MB, passed to tcpdump -C. tcpdump only
# expands the strftime() pattern in -w when -G is also supplied, so this is
# paired with CAPTURE_ROTATE_SECONDS below: -G gives the file its fresh
# timestamped name, -C is the hard 100MB cap that forces a new file sooner
# on bursty links (tcpdump appends a numeric suffix to the current
# timestamped name in that case).
CAPTURE_ROTATE_MB=100

# How often (seconds) tcpdump re-evaluates -w's strftime pattern and starts
# a fresh timestamped file. Keep this short relative to expected traffic
# volume so filenames stay close to one-file-per-100MB in practice.
CAPTURE_ROTATE_SECONDS=300

# Filename timestamp pattern (strftime), consumed by tcpdump -w
CAPTURE_FILENAME_PATTERN="capture_%Y-%m-%d_%H-%M-%S.pcap"

# Optional BPF capture filter applied to tcpdump (leave empty to capture all
# traffic traversing the bridge)
CAPTURE_FILTER=""

# --- Bridge / interface settings ----------------------------------------
# Name of the transparent layer-2 bridge that joins the two physical
# Ethernet ports together.
BRIDGE_NAME="br-tap"

# Interfaces to always exclude when auto-detecting physical Ethernet ports.
# Regex alternation consumed by `grep -E`.
IFACE_EXCLUDE_REGEX="^(lo|veth|docker|br-|virbr|tailscale|wg|tun|wl)"

# --- MAC cloning ----------------------------------------------------------
# Enable/disable MAC address cloning of the target-facing interface so the
# tap is invisible on the wire (the host's original MAC is preserved).
MAC_CLONE_ENABLED=true

# If set, this MAC address is cloned onto IFACE_TARGET instead of
# auto-learning it from traffic. Leave empty to auto-detect the original
# host's MAC by sniffing the first frames seen on IFACE_HOST.
TARGET_HOST_MAC=""

# --- USB offload ----------------------------------------------------------
USB_MOUNT_POINT="/mnt/usb"
USB_LOOT_SUBDIR="loot"

# --- Tailscale --------------------------------------------------------
# Extra flags appended to `tailscale up` during setup (e.g. --ssh,
# --advertise-exit-node, --accept-routes). Leave empty for defaults.
TAILSCALE_UP_FLAGS="--ssh"
